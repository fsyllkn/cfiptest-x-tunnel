name: Fetch X-Tunnel v13 Android arm64
on:
  push:
    branches: [build/ztunnel-core-v13]
jobs:
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download and verify official v.13 Android CLI
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/hhsw2015/x-tunnel/releases/download/v.13
          curl -L --fail --retry 3 -o x-tunnel-android-arm64.tar.gz "$base/x-tunnel-android-arm64.tar.gz"
          curl -L --fail --retry 3 -o SHA256SUMS.txt "$base/SHA256SUMS.txt"
          awk '$2 == "x-tunnel-android-arm64.tar.gz" || $2 == "*x-tunnel-android-arm64.tar.gz"' SHA256SUMS.txt > archive.sha256
          test -s archive.sha256
          sha256sum -c archive.sha256
          tar -xzf x-tunnel-android-arm64.tar.gz
          chmod 0755 x-tunnel-android-arm64
          sha256sum x-tunnel-android-arm64 > x-tunnel-android-arm64.sha256
          file x-tunnel-android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: x-tunnel-v13-android-arm64-cli
          path: |
            x-tunnel-android-arm64
            x-tunnel-android-arm64.sha256
          if-no-files-found: error
          retention-days: 7
